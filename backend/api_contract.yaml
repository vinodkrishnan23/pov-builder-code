openapi: 3.1.0
info:
  title: Untitled POC API
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      x-user-story-ids: [UC-1, UC-2, UC-3, UC-4]
      responses:
        '200':
          description: Database is connected
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: {type: string, const: ok}
                  db: {type: string, const: connected}
  /tenants:
    get:
      operationId: listTenants
      x-user-story-ids: [UC-1, UC-2, UC-3, UC-4]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: Paginated results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
                  nextCursor: {type: [string, 'null']}
  /documents:
