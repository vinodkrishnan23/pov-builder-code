[project]
name = "pov-builder"
version = "0.1.0"
description = "Standalone LangGraph POV Generator, built phase-by-phase per new.md"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.6.0",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "pygithub>=2.10.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "playwright>=1.48.0",
]

[project.scripts]
pov-builder = "pov_builder.run:main"
pov-builder-web = "pov_builder.webapp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pov_builder"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
